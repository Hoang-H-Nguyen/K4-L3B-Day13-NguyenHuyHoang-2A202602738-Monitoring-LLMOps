alerts:
  - name: HighLatencyP95
    severity: warning
    condition: p95(response_sent.latency_ms) > 3000
    duration: 5m
    type: symptom-based
    channel: "slack:#k4-l3b-alerts"
    owner: student-2A202602738
    runbook: docs/alerts.md#alert-1-highlatencyp95
  - name: HighErrorRate
    severity: critical
    condition: error_rate_pct > 2
    duration: 5m
    type: symptom-based
    channel: "slack:#k4-l3b-alerts"
    owner: student-2A202602738
    runbook: docs/alerts.md#alert-2-higherrorrate
  - name: LowRetrievalSuccess
    severity: critical
    condition: retrieval_success_rate_pct < 90
    duration: 5m
    type: symptom-based
    channel: "slack:#k4-l3b-alerts"
    owner: student-2A202602738
    runbook: docs/alerts.md#alert-3-lowretrievalsuccess
